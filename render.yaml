services:
  - type: web
    name: nocodb
    env: docker
    dockerfilePath: ./docker/Dockerfile
    autoDeploy: false
    healthCheckPath: /dashboard#
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nocodb-db
          property: connectionString
      - key: PORT
        value: "8080"
      - key: NC_DISABLE_API_THROT
        value: "true"
      - key: NC_AUTH_JWT_SECRET
        generateValue: true
      - key: NC_MIN_NUM_ROWS_ABOVE_LIMIT_FOR_EXPORT
        value: "20000"  # Optional: improve exports

databases:
  - name: nocodb-db
    databaseName: nocodb
    postgresVersion: 15
    user: nocodb

